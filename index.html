<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data-Class</title>
  <meta name="description" content="All Data-Class sessions in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Data-Class home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        Data-Class
      </a>
      <span class="header-count" id="session-count">22 sessions</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1>Welcome to <span class="nowrap">Data-Analytics</span> Class</h1>
        <p>Every session of the course in one place. Pick a session to open its notes and materials.</p>
      </div>
    </section>

    <section class="sessions" aria-label="Sessions">
      <div class="wrap">
        <ol class="session-grid" id="session-grid">
          <!-- Cards are generated by assets/js/main.js from assets/js/sessions.js -->
        </ol>
        <noscript>
          <p>Turn on JavaScript to see the session list.</p>
        </noscript>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">Data-Class</div>
  </footer>

  <script src="assets/js/sessions.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
